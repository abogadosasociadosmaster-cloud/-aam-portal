<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1C2330">
<meta name="format-detection" content="telephone=no">
<title>Mi Expediente · AAM Abogados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg-page:#F5F2EC;
    --bg-surface:#FFFFFF;
    --bg-deep:#1C2330;
    --bg-deep-soft:#2A3343;
    --primary:#1C2330;
    --primary-hover:#2A3343;
    --gold:#B89766;
    --gold-soft:#D4B88A;
    --gold-bg:rgba(184,151,102,0.08);
    --gold-bg-strong:rgba(184,151,102,0.18);
    --text:#1A1A1A;
    --text-muted:#6B6B6B;
    --text-dim:#9A9A9A;
    --border:#E5DFD2;
    --border-strong:#D4CCB8;
    --divider:#EFE9DC;
    --success:#15803d;
    --serif:"Cormorant Garamond","Libre Caslon Text",Georgia,"Times New Roman",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --mono:"IBM Plex Mono","Courier New",monospace;
    --r-sm:3px;
    --r-md:6px;
    --r-lg:10px;
    --shadow-card:0 1px 3px rgba(28,35,48,.04),0 8px 24px rgba(28,35,48,.06);
    --shadow-btn:0 2px 8px rgba(28,35,48,.18);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ============ RESET ============ */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);
    background:var(--bg-page);
    color:var(--text);
    font-size:16px;
    line-height:1.5;
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}

  /* ============ LAYOUT ============ */
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* ============ HEADER ============ */
  .header{
    background:var(--bg-deep);
    color:#fff;
    padding:24px 20px 28px;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:"";
    position:absolute;
    bottom:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg,transparent 0%,var(--gold) 30%,var(--gold) 70%,transparent 100%);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand__logo{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--gold);
    overflow:hidden;
    display:grid;
    place-items:center;
    flex-shrink:0;
  }
  .brand__logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .brand__text{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }
  .brand__title{
    font-family:var(--serif);
    font-weight:600;
    font-size:20px;
    line-height:1.1;
    letter-spacing:0.5px;
    color:#fff;
  }
  .brand__title span{color:var(--gold);font-weight:500;margin:0 2px}
  .brand__subtitle{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold-soft);
    opacity:.85;
  }

  /* ============ EXPEDIENTE BAR ============ */
  .expBar{
    background:var(--bg-deep-soft);
    color:#fff;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .expBar__left{display:flex;flex-direction:column;gap:2px;min-width:0}
  .expBar__label{
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold-soft);
    opacity:.8;
  }
  .expBar__id{
    font-family:var(--mono);
    font-size:13px;
    font-weight:500;
    color:#fff;
    letter-spacing:0.5px;
  }
  .expBar__right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0;text-align:right}
  .expBar__name{
    font-family:var(--serif);
    font-size:16px;
    font-weight:600;
    color:#fff;
    line-height:1.2;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:180px;
  }
  .expBar__greeting{
    font-size:10px;
    color:var(--gold-soft);
    opacity:.75;
    text-transform:uppercase;
    letter-spacing:1px;
  }

  /* ============ STATUS PILL ============ */
  .statusBar{
    background:#fff;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .statusDot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--state-color,#6b7280);
    position:relative;
    flex-shrink:0;
  }
  .statusDot::after{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background:var(--state-color,#6b7280);
    opacity:.3;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:.3}
    50%{transform:scale(1.6);opacity:0}
  }
  .statusBar__label{
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .statusBar__value{
    font-size:13px;
    font-weight:500;
    color:var(--text);
  }

  /* ============ MAIN ============ */
  .main{
    flex:1;
    padding:24px 20px 40px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .card{
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-top:3px solid var(--primary);
    border-radius:var(--r-md);
    padding:22px 20px 24px;
    box-shadow:var(--shadow-card);
    opacity:0;
    transform:translateY(8px);
    animation:fadeUp .5s ease-out forwards;
  }
  .card:nth-child(1){animation-delay:.05s}
  .card:nth-child(2){animation-delay:.15s}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

  .card__eyebrow{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1.8px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 6px;
    font-weight:500;
  }
  .card__title{
    font-family:var(--serif);
    font-size:26px;
    line-height:1.15;
    font-weight:600;
    color:var(--primary);
    margin:0 0 10px;
    letter-spacing:-0.3px;
  }
  .card__lead{
    font-size:14.5px;
    color:var(--text-muted);
    line-height:1.55;
    margin:0 0 18px;
  }

  /* ============ DOCS LIST ============ */
  .docList{
    list-style:none;
    margin:0 0 22px;
    padding:0;
    border-top:1px solid var(--divider);
  }
  .docItem{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 4px;
    border-bottom:1px solid var(--divider);
    transition:background .2s ease,padding-left .2s ease;
    opacity:0;
    transform:translateX(-6px);
    animation:slideIn .35s ease-out forwards;
  }
  @keyframes slideIn{to{opacity:1;transform:translateX(0)}}
  .docItem:hover{
    background:var(--gold-bg);
    padding-left:8px;
  }
  .docItem__num{
    font-family:var(--mono);
    font-size:11px;
    color:var(--gold);
    background:var(--gold-bg-strong);
    border-radius:var(--r-sm);
    padding:2px 7px;
    flex-shrink:0;
    margin-top:1px;
    font-weight:500;
    min-width:26px;
    text-align:center;
  }
  .docItem__text{
    font-size:14.5px;
    color:var(--text);
    line-height:1.5;
    flex:1;
    min-width:0;
    word-wrap:break-word;
  }

  /* ============ EMPTY STATE ============ */
  .docEmpty{
    text-align:center;
    padding:24px 12px 28px;
    border:1px dashed var(--border-strong);
    border-radius:var(--r-md);
    background:var(--gold-bg);
    margin-bottom:22px;
  }
  .docEmpty__icon{
    font-family:var(--serif);
    font-size:38px;
    color:var(--gold);
    line-height:1;
    margin-bottom:8px;
  }
  .docEmpty__title{
    font-family:var(--serif);
    font-size:20px;
    color:var(--primary);
    margin:0 0 4px;
    font-weight:600;
  }
  .docEmpty__sub{
    font-size:13px;
    color:var(--text-muted);
    margin:0;
  }

  /* ============ BUTTONS ============ */
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px 18px;
    font-family:var(--sans);
    font-size:15px;
    font-weight:600;
    letter-spacing:.2px;
    border-radius:var(--r-md);
    border:none;
    cursor:pointer;
    transition:transform .12s ease,background .2s ease,box-shadow .2s ease;
    text-decoration:none;
    position:relative;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .btn:active{transform:scale(0.985)}
  .btn--primary{
    background:var(--primary);
    color:#fff;
    box-shadow:var(--shadow-btn);
  }
  .btn--primary:hover{background:var(--primary-hover)}
  .btn--secondary{
    background:transparent;
    color:var(--primary);
    border:1px solid var(--border-strong);
  }
  .btn--secondary:hover{background:var(--gold-bg);border-color:var(--gold)}
  .btn__icon{
    width:18px;height:18px;
    flex-shrink:0;
    stroke:currentColor;
    stroke-width:2;
    fill:none;
  }
  /* Ripple */
  .ripple{
    position:absolute;
    border-radius:50%;
    transform:scale(0);
    background:rgba(184,151,102,0.45);
    pointer-events:none;
    animation:ripple .55s ease-out forwards;
  }
  @keyframes ripple{
    to{transform:scale(4);opacity:0}
  }

  /* ============ HELP NOTE ============ */
  .help{
    margin-top:14px;
    padding:14px 16px;
    background:var(--gold-bg);
    border-left:3px solid var(--gold);
    border-radius:0 var(--r-sm) var(--r-sm) 0;
    font-size:13px;
    color:var(--text-muted);
    line-height:1.55;
  }
  .help strong{color:var(--primary);font-weight:600}

  /* ============ TOAST ============ */
  .toast{
    position:fixed;
    bottom:calc(20px + var(--safe-bottom));
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--primary);
    color:#fff;
    padding:12px 20px;
    border-radius:var(--r-md);
    font-size:13.5px;
    box-shadow:0 8px 24px rgba(28,35,48,.25);
    opacity:0;
    pointer-events:none;
    transition:all .3s ease;
    z-index:1000;
    max-width:90%;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ============ CONFIRMAR DOCS ============ */
  .confirm-section{
    margin-top:20px;
    padding:18px 0 0;
    border-top:1px dashed var(--border-strong);
  }
  .confirm-label{
    font-size:14px;
    font-weight:600;
    color:var(--primary);
    margin:0 0 4px;
    text-align:center;
  }
  .confirm-sub{
    font-size:12px;
    color:var(--text-muted);
    margin:0 0 14px;
    text-align:center;
  }
  .btn--confirm{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:13px 18px;
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    color:var(--success);
    background:rgba(21,128,61,.06);
    border:1.5px solid rgba(21,128,61,.35);
    border-radius:var(--r-md);
    cursor:pointer;
    transition:background .2s,border-color .2s;
  }
  .btn--confirm:hover{background:rgba(21,128,61,.12);border-color:rgba(21,128,61,.6)}
  .btn--confirm:disabled{opacity:.5;cursor:not-allowed}
  .confirm-ok{
    padding:16px;
    background:rgba(21,128,61,.07);
    border:1px solid rgba(21,128,61,.22);
    border-radius:var(--r-md);
    text-align:center;
  }
  .confirm-ok__icon{font-size:26px;margin-bottom:6px}
  .confirm-ok__title{
    font-size:15px;font-weight:700;
    color:var(--success);margin:0 0 4px;
  }
  .confirm-ok__sub{
    font-size:12px;color:var(--text-muted);margin:0;line-height:1.5;
  }
  .confirm-err{
    padding:14px;
    background:rgba(239,68,68,.05);
    border:1px solid rgba(239,68,68,.18);
    border-radius:var(--r-md);
    font-size:13px;
    color:#b91c1c;
    text-align:center;
    line-height:1.55;
  }
  .confirm-err a{color:#b91c1c;font-weight:600}

  /* ============ FOOTER ============ */
  .footer{
    padding:24px 20px 28px;
    text-align:center;
    border-top:1px solid var(--border);
    background:rgba(255,255,255,0.5);
  }
  .footer__brand{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1.4px;
    color:var(--text-dim);
    text-transform:uppercase;
    margin:0 0 16px;
  }
  /* Separador sutil */
  .footer__sep{
    display:block;
    margin:0 auto 14px;
    width:32px;
    height:1px;
    background:var(--border-strong);
  }
  /* Pregunta de invitación */
  .footer__invite{
    font-size:12px;
    color:var(--text-muted);
    margin:0 0 12px;
    font-style:italic;
  }
  /* Botones de contacto secundario */
  .footer__canales{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .footer__canal{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--text-muted);
    text-decoration:none;
    border:1px solid var(--border-strong);
    border-radius:20px;
    padding:5px 13px;
    transition:color .2s,border-color .2s,background .2s;
  }
  .footer__canal:hover{
    color:var(--primary);
    border-color:var(--gold);
    background:var(--gold-bg);
  }
  .footer__canal--forms{
    border-color:var(--gold-soft);
    color:var(--gold);
  }
  .footer__canal--forms:hover{
    background:var(--gold-bg-strong);
    color:var(--primary);
  }
  /* Aviso legal pequeño */
  .footer__legal{
    font-size:10px;
    color:var(--text-dim);
    margin:0;
    line-height:1.5;
    max-width:300px;
    margin-inline:auto;
  }

  /* ============ ERROR PAGE ============ */
  .errorPage{
    flex:1;
    display:grid;
    place-items:center;
    padding:40px 24px;
    text-align:center;
  }
  .errorPage__inner{max-width:340px}
  .errorPage__icon{
    font-family:var(--serif);
    font-size:64px;
    color:var(--gold);
    line-height:1;
    margin-bottom:16px;
  }
  .errorPage__title{
    font-family:var(--serif);
    font-size:28px;
    color:var(--primary);
    margin:0 0 12px;
    font-weight:600;
  }
  .errorPage__msg{
    font-size:15px;
    color:var(--text-muted);
    line-height:1.55;
    margin:0 0 20px;
  }
  .errorPage__code{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:1.2px;
    margin-top:24px;
  }

  /* ============ RESPONSIVE TWEAKS ============ */
  @media (max-width:360px){
    .header{padding:20px 16px 24px}
    .expBar,.statusBar,.main{padding-left:16px;padding-right:16px}
    .card__title{font-size:23px}
    .brand__title{font-size:18px}
    .expBar__name{max-width:140px;font-size:14px}
  }
</style>
</head>

<div class="app" id="app"></div>

<script>
/* ===========================================================
   AAM PORTAL · MI EXPEDIENTE
   Versión 1.1 — 2026-04-25
   Fix: número de teléfono correcto 2612430063
   ===========================================================
   URL params:
     ?id=AAM26-001            ID del expediente (req)
     &t=k7x2m9p4               Token (opc, validación futura)
     &action=docs              Acción (default: docs)
     &nombre=María%20González  Nombre del cliente
     &estado=EN_GESTION_ADMIN  Código de estado
     &docs=DNI|Recibo|...      Lista de docs separada por |
     &drive=ID_CARPETA         ID o URL de la carpeta Drive
   =========================================================== */

(function(){
  'use strict';

  // ============ ENDPOINT GAS (mismo que el War Room) ============
  const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxNthU585zRC4iWhcpwRqoMecLWqzybCvWhjD7pSYx0ro5Xu6EkTnv38blpVbsn8clo/exec';

  // ============ CONTACTO DEL ESTUDIO ============
  // Actualizar aquí si cambia el número. Formato: 54 9 [área][número]
  const TEL_ESTUDIO  = '5492612430063';
  const TEL_DISPLAY  = '+54 9 261 243-0063';
  const MAIL_ESTUDIO = 'abogadosasociadosmaster@gmail.com';

  // ============ CANAL DE CONSULTAS — GOOGLE FORMS ============
  // 1. Crear un Google Form con los campos:
  //    - "Nombre completo"         → anotar entry.XXXXXXXXX
  //    - "N° de expediente"        → anotar entry.XXXXXXXXX
  //    - "Tipo de consulta"        → Lista: Consulta general / Información adicional / Urgencia / Reclamo / Otro
  //    - "Contanos con detalle"    → Párrafo libre
  //    - "¿Cómo preferís que te contactemos?" → WA / Email / Teléfono / Sin preferencia
  // 2. En el Form → ⋮ → "Obtener enlace de relleno previo"
  //    Completar los campos "Nombre" y "Expediente" con texto de prueba y copiar la URL
  // 3. Reemplazar FORMS_BASE_URL con esa URL (sin los &entry... al final)
  //    y completar FORMS_ENTRY_ID y FORMS_ENTRY_NOMBRE con los IDs de campo
  const FORMS_BASE_URL    = '';           // ← COMPLETAR: URL base del Google Form
  const FORMS_ENTRY_ID    = '';           // ← COMPLETAR: entry.XXXXXXXX del campo "N° expediente"
  const FORMS_ENTRY_NOMBRE= '';           // ← COMPLETAR: entry.XXXXXXXX del campo "Nombre"

  // Construye la URL pre-cargada del Forms para una causa específica
  function buildFormsURL(id, nombre){
    if(!FORMS_BASE_URL) return '';
    let url = FORMS_BASE_URL + '?usp=pp_url';
    if(FORMS_ENTRY_ID    && id)     url += `&${FORMS_ENTRY_ID}=${encodeURIComponent(id)}`;
    if(FORMS_ENTRY_NOMBRE && nombre) url += `&${FORMS_ENTRY_NOMBRE}=${encodeURIComponent(nombre)}`;
    return url;
  }

  // ============ CATÁLOGO DE ESTADOS ============
  const ESTADOS = {
    INGRESADO:              { label:'Ingresado',                     color:'#6b7280' },
    PENDIENTE_DOCS:         { label:'Pendiente de documentación',    color:'#f59e0b' },
    DOCS_COMPLETOS:         { label:'Documentación completa',        color:'#3b82f6' },
    EN_GESTION_ADMIN:       { label:'En gestión administrativa',     color:'#3b82f6' },
    PRESENTADO_CIA:         { label:'Presentado a compañía',         color:'#f97316' },
    ESPERA_RESPUESTA:       { label:'En espera de respuesta',        color:'#f59e0b' },
    OFERTA_RECIBIDA:        { label:'Oferta recibida',               color:'#8b5cf6' },
    ACEPTADO_ADMIN:         { label:'Oferta aceptada',               color:'#22c55e' },
    COBRADO_ADMIN:          { label:'Cobrado',                       color:'#15803d' },
    RECHAZADO_ESCALA:       { label:'Derivado a vía judicial',       color:'#ef4444' },
    DEMANDA_PREPARACION:    { label:'Preparando demanda',            color:'#6366f1' },
    DEMANDA_PRESENTADA:     { label:'Demanda presentada',            color:'#1e40af' },
    TRASLADO_DEMANDA:       { label:'Traslado de demanda',           color:'#1e40af' },
    CONTESTACION_DEMANDA:   { label:'Contestación de demanda',       color:'#1e40af' },
    APERTURA_PRUEBA:        { label:'Período de prueba',             color:'#0369a1' },
    PRODUCCION_PRUEBA:      { label:'Producción de prueba',          color:'#0369a1' },
    ALEGATOS:               { label:'Alegatos',                      color:'#0369a1' },
    LLAMADO_AUTOS_SENTENCIA:{ label:'Esperando sentencia',           color:'#0e7490' },
    SENTENCIA:              { label:'Sentencia dictada',             color:'#0e7490' },
    APELACION:              { label:'En apelación',                  color:'#dc2626' },
    SEGUNDA_INSTANCIA:      { label:'Segunda instancia',             color:'#dc2626' },
    FIRME:                  { label:'Sentencia firme',               color:'#15803d' },

  function obtenerEtiquetaDoc(clave) {
    const k = String(clave).trim().toUpperCase();
    return DOCS_LEGIBLES[k] || k.replace(/_/g, ' ').toLowerCase().replace(/^\w/, function(c){ return c.toUpperCase(); });

  function getParams(){
    const p = new URLSearchParams(window.location.search);
    const get = (k, fb='') => (p.get(k) ?? fb).trim();
    return {

      token:   get('t', ''),
      action:  get('action', 'docs').toLowerCase(),
      nombre:  get('nombre', ''),
      estado:  get('estado', '').toUpperCase(),
      docs:    get('docs', ''),
      drive:   get('drive', ''),
    };

  function parseDocs(raw){
    if(!raw) return [];
    return raw.split('|')
      .map(d => d.trim())
      .filter(Boolean)
      .slice(0, 30);

  function buildDriveUrl(driveParam){
    if(!driveParam) return null;
    const v = driveParam.trim();

    return `https://drive.google.com/drive/folders/${encodeURIComponent(v)}`;

  // ============ RIPPLE EFFECT ============
  function attachRipple(btn){
    btn.addEventListener('pointerdown', function(e){
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size/2;
      const y = e.clientY - rect.top - size/2;
      const r = document.createElement('span');
      r.className = 'ripple';
      r.style.width = r.style.height = size + 'px';
      r.style.left = x + 'px';
      r.style.top  = y + 'px';
      btn.appendChild(r);
      setTimeout(() => r.remove(), 600);
    });
  }

  // ============ TOAST ============
  function toast(msg, ms=2400){
    let t = $('#toast');
    if(!t){
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), ms);
  }

      localStorage.setItem(key, JSON.stringify(visits.slice(-20)));
    } catch(e){}

  // ============ SUBIDA DIRECTA DE ARCHIVOS (BASE64) ============
  function subirArchivoDirecto(idCausa, docClave, input) {
    if (!input.files || input.files.length === 0) return;
    const file = input.files[0];
    
    // Límite de 12MB para Base64 y Apps Script
    if (file.size > 12 * 1024 * 1024) {
      alert("El archivo es demasiado grande (máximo 12MB).");
      input.value = "";
      return;
    }

    const btn = document.getElementById('btn_upload_' + docClave);
    const statusText = document.getElementById('status_' + docClave);
    
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '⏳...';
    }
    if (statusText) {
      statusText.innerHTML = '<span style="color:#d97706; font-size:11px; font-weight:500;">⏳ Subiendo archivo...</span>';
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64Data = e.target.result;

      fetch(GAS_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'subirArchivoPortal',
          idCausa: idCausa,
          docClave: docClave,
          fileName: file.name,
          mimeType: file.type,
          fileData: base64Data
        })
      })
      .then(() => {
        try {
          localStorage.setItem('aam_uploaded_' + idCausa + '_' + docClave, 'EN_REVISION');
        } catch(err) {}

        if (statusText) {
          statusText.innerHTML = '<span style="color:#d97706; font-size:11px; font-weight:600;">🔍 En revisión (Recibido)</span>';
        }
        if (btn) {
          btn.style.display = 'none';
        }
        toast("✓ Archivo subido con éxito para revisión.");
        checkAllUploaded(idCausa);
      })
      .catch(err => {
        console.error(err);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '📤 Subir';
        }
        if (statusText) {
          statusText.innerHTML = '<span style="color:#dc2626; font-size:11px; font-weight:500;">❌ Error al subir</span>';
        }
        toast("❌ Error de red al subir. Intente de nuevo.");
      });
    };
    reader.onerror = function() {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '📤 Subir';
      }
      toast("❌ Error al leer el archivo.");
    };
    reader.readAsDataURL(file);
  }

  function checkAllUploaded(idCausa) {
    const buttons = document.querySelectorAll('.btn-upload');
    let allHidden = true;
    buttons.forEach(btn => {
      if (btn.style.display !== 'none') allHidden = false;
    });
    if (allHidden) {
      toast("✓ ¡Todos los documentos pendientes fueron cargados!");
    }
  }

  window.subirArchivoDirecto = subirArchivoDirecto;

  // ============ CONFIRMAR ENVÍO DE DOCS AL ABOGADO ============
  // Llama al GAS con action confirmarDocs (mode no-cors, igual que el War Room).
  // Actualiza DOCS_CONFIRMADOS_CLIENTE + FECHA + BITACORA en el Sheet
  // y notifica al abogado por email.
  function confirmarEnvioDocs(id, nombre){
    const btn = $('#btnConfirmar');
    const sec = $('#confirmSection');
    if(!btn || !sec) return;

    btn.disabled = true;
    btn.innerHTML = '⏳ &nbsp;Enviando aviso...';

    const hoy = new Date().toISOString().split('T')[0];

    fetch(GAS_ENDPOINT, {
      method:  'POST',
      mode:    'no-cors',            // igual que War Room → no se puede leer la respuesta
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action:        'confirmarDocs',
        idCausa:       id,
        clienteNombre: nombre,
        fecha:         hoy,
        ua:            (navigator.userAgent || '').slice(0, 200),
      }),
    })
    .then(() => {
      // no-cors: la respuesta no es legible, asumimos éxito si no hubo error de red
      try { localStorage.setItem('aam_conf_' + id, hoy); } catch(e){}
      sec.innerHTML = `
        <div class="confirm-ok">
          <div class="confirm-ok__icon">✅</div>
          <p class="confirm-ok__title">¡Listo! Le avisamos a tu abogado/a</p>
          <p class="confirm-ok__sub">
            Revisarán tu carpeta y te contactaremos para los próximos pasos.<br>
            Si tenés algo más, usá el correo del pie de página.
          </p>
        </div>`;
    })
    .catch(() => {
      sec.innerHTML = `
        <div class="confirm-err">
          No pudimos enviar el aviso ahora mismo.<br>
          <a href="https://wa.me/${TEL_ESTUDIO}">Escribinos por WhatsApp</a> para avisarnos que subiste los documentos.
        </div>`;
      btn.disabled = false;
      btn.innerHTML = '✓ &nbsp;Ya subí los documentos';
    });
  }

  // ============ BOOT ============
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }

})();
</script>
</body>
</html>
